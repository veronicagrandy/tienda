<nav class="navbar navbar-expand-md navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/productos" (click)="cerrarMenu()">Tienda de Barrio</a>

    <button class="navbar-toggler" type="button" aria-controls="menuPrincipal" aria-label="Mostrar u ocultar navegación"
      [attr.aria-expanded]="menuAbierto()" (click)="alternarMenu()">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div id="menuPrincipal" class="collapse navbar-collapse" [ngClass]="{ show: menuAbierto() }">
      <ul class="navbar-nav ms-auto">
        @for (enlace of enlaces; track enlace.ruta) {
        <li class="nav-item">
          <!-- routerLinkActive detecta la ruta activa; las clases se aplican con ngClass para sumar la regla del detalle -->
          <a class="nav-link" [routerLink]="enlace.ruta" routerLinkActive #enlaceActivo="routerLinkActive"
            [routerLinkActiveOptions]="enlace.opcionesActivo"
            [ngClass]="{ 'active fw-semibold': estaActivo(enlace, enlaceActivo.isActive) }"
            [attr.aria-current]="estaActivo(enlace, enlaceActivo.isActive) ? 'page' : null" (click)="cerrarMenu()">
            {{ enlace.etiqueta }}
          </a>
        </li>
        }
      </ul>
    </div>
  </div>
</nav>
